version: 1.3.9

cache: true

interface:
  customWelcome: 'Como posso ajudar você hoje?'
  modelSelect: true
  parameters: false
  presets: false
  prompts:
    use: false
    create: false
    share: false
    public: false
  bookmarks: true
  memories: true
  multiConvo: true
  agents:
    use: true
    create: false
    share: false
    public: false
  marketplace:
    use: false
  fileSearch: true
  fileCitations: true
  webSearch: true
  runCode: false
  mcpServers:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: false
    groups: false
    roles: false

registration:
  socialLogins: []

endpoints:
  agents:
    capabilities:
      - deferred_tools
      - file_search
      - web_search
      - artifacts
      - tools
      - ocr
  openAI:
    titleConvo: true
    titleModel: gpt-4o-mini
  anthropic:
    titleConvo: true
    titleModel: claude-haiku-4-5-20251001
    dropParams:
      - temperature
  google:
    titleConvo: true
    titleModel: gemini-2.5-flash
  custom:
    - name: OpenRouter
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-title: 'Leads Per Hour'
        http-referer: '${DOMAIN_CLIENT}'
      models:
        default:
          - openai/gpt-4o-mini
          - anthropic/claude-haiku-4.5
          - anthropic/claude-sonnet-4.5
          - google/gemini-2.5-flash
          - x-ai/grok-4.1-fast
          - moonshotai/kimi-k2
          - moonshotai/kimi-k2.6
          - qwen/qwen-2.5-72b-instruct
          - mistralai/mistral-small-3.2-24b-instruct
          - meta-llama/llama-3.3-70b-instruct
        fetch: true
      titleConvo: true
      titleModel: openai/gpt-4o-mini
      summarize: false
      summaryModel: openai/gpt-4o-mini
      dropParams:
        - stop
      addParams:
        max_tokens: 2048
      modelDisplayLabel: OpenRouter
      iconURL: assets/openrouter.png

    - name: Groq
      apiKey: '${GROQ_API_KEY}'
      baseURL: 'https://api.groq.com/openai/v1'
      models:
        default:
          - llama-3.3-70b-versatile
          - llama-3.1-8b-instant
        fetch: true
      titleConvo: true
      titleModel: llama-3.1-8b-instant
      summarize: false
      summaryModel: llama-3.1-8b-instant
      modelDisplayLabel: Groq
      iconURL: assets/groq.png

    - name: Perplexity
      apiKey: '${PERPLEXITY_API_KEY}'
      baseURL: 'https://api.perplexity.ai'
      models:
        default:
          - sonar
          - sonar-pro
          - sonar-reasoning
        fetch: false
      titleConvo: true
      titleModel: sonar
      summarize: false
      summaryModel: sonar
      dropParams:
        - stop
      addParams:
        max_tokens: 2048
      modelDisplayLabel: Perplexity
      iconURL: assets/perplexity.png

    - name: DeepSeek
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com/v1'
      models:
        default:
          - deepseek-v4-flash
          - deepseek-v4-pro
        fetch: true
      titleConvo: true
      titleModel: deepseek-v4-flash
      summarize: false
      summaryModel: deepseek-v4-flash
      modelDisplayLabel: DeepSeek
      iconURL: assets/deepseek.svg

modelSpecs:
  enforce: false
  prioritize: true
  addedEndpoints:
    - agents
    - openAI
    - anthropic
    - google
    - OpenRouter
    - Groq
    - Perplexity
    - DeepSeek
  list:
    - name: lph-gpt-fast
      label: GPT rapido
      default: true
      iconURL: openAI
      preset:
        endpoint: openAI
        model: gpt-4o-mini
        modelLabel: GPT rapido
        greeting: 'Bom dia, Ricardo. Como posso ajudar você hoje?'
        promptPrefix: |
          Você é a Leads Per Hour, um assistente de IA geral, claro e prático. Ajude o usuário com escrita, pesquisa, análise, imagens, arquivos, ideias, planejamento e execução. Não force nenhum contexto específico a menos que o usuário peça.

    - name: lph-gpt-power
      label: GPT forte
      iconURL: openAI
      preset:
        endpoint: openAI
        model: gpt-4o
        modelLabel: GPT forte
        greeting: 'Bom dia, Ricardo. Como posso ajudar você hoje?'
        promptPrefix: |
          Você é a Leads Per Hour, um assistente de IA geral, claro e prático. Ajude o usuário com escrita, pesquisa, análise, imagens, arquivos, ideias, planejamento e execução. Não force nenhum contexto específico a menos que o usuário peça.

    - name: lph-claude
      label: Claude estrategico
      iconURL: anthropic
      preset:
        endpoint: anthropic
        model: claude-sonnet-4-5-20250929
        modelLabel: Claude estrategico
        greeting: 'Bom dia, Ricardo. Como posso ajudar você hoje?'
        promptPrefix: |
          Você é a Leads Per Hour, um assistente de IA geral, claro e prático. Ajude o usuário com escrita, pesquisa, análise, imagens, arquivos, ideias, planejamento e execução. Não force nenhum contexto específico a menos que o usuário peça.

    - name: lph-gemini
      label: Gemini arquivos
      iconURL: google
      preset:
        endpoint: google
        model: gemini-2.5-pro
        modelLabel: Gemini arquivos
        greeting: 'Bom dia, Ricardo. Como posso ajudar você hoje?'
        promptPrefix: |
          Você é a Leads Per Hour, um assistente de IA geral, claro e prático. Ajude o usuário com escrita, pesquisa, análise, imagens, arquivos, ideias, planejamento e execução. Não force nenhum contexto específico a menos que o usuário peça.

    - name: lph-kimi
      label: Kimi via OpenRouter
      iconURL: assets/openrouter.png
      preset:
        endpoint: OpenRouter
        model: moonshotai/kimi-k2.6
        modelLabel: Kimi
        greeting: 'Bom dia, Ricardo. Como posso ajudar você hoje?'
        max_tokens: 2048
        promptPrefix: |
          Você é a Leads Per Hour, um assistente de IA geral, claro e prático. Ajude o usuário com escrita, pesquisa, análise, imagens, arquivos, ideias, planejamento e execução. Não force nenhum contexto específico a menos que o usuário peça.

    - name: lph-groq
      label: Groq rapido
      iconURL: assets/groq.png
      preset:
        endpoint: Groq
        model: llama-3.3-70b-versatile
        modelLabel: Groq rapido
        greeting: 'Bom dia, Ricardo. Como posso ajudar você hoje?'
        promptPrefix: |
          Você é a Leads Per Hour, um assistente de IA geral, claro e prático. Ajude o usuário com escrita, pesquisa, análise, imagens, arquivos, ideias, planejamento e execução. Não force nenhum contexto específico a menos que o usuário peça.
